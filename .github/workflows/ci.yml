name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: MMO_Server

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Server.sln

      - name: Build
        run: dotnet build Server.sln --configuration Release --no-restore

      - name: Test
        run: dotnet test Server.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: MMO_Server/TestResults/*.trx

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CICD/Dockerfile.server
          push: false
          tags: mmo-server:ci
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max

      - name: Build accountserver image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: CICD/Dockerfile.accountserver
          push: false
          tags: mmo-accountserver:ci
          cache-from: type=gha,scope=accountserver
          cache-to: type=gha,scope=accountserver,mode=max
