# 게임서버가 남긴 구조화 JSON 로그(.jsonl)를 tail 해서 Elasticsearch로 보낸다.
# 서버 컨테이너와 server-logs 볼륨을 공유하고, 읽기 전용으로만 붙는다.

filebeat.inputs:
  - type: filestream
    id: mmo-server
    enabled: true
    paths:
      - /logs/server-*.jsonl
    parsers:
      # Serilog CompactJsonFormatter 출력이 이미 한 줄 = 한 JSON 이라
      # grok 파싱 없이 그대로 필드로 펼친다.
      - ndjson:
          target: ""              # 루트에 펼침 (nested 로 감싸지 않음)
          overwrite_keys: true
          add_error_key: true
          expand_keys: true

processors:
  # Filebeat 자신의 메타데이터는 불필요하게 인덱스를 키우므로 제거
  - drop_fields:
      fields: ["agent", "ecs", "input", "host", "log.offset"]
      ignore_missing: true
  # Serilog 의 @t(발생 시각)를 이벤트 시각으로 사용. 없으면 수집 시각이 찍혀
  # 대시보드 시간축이 실제 발생 시각과 어긋난다.
  - timestamp:
      field: "@t"
      layouts:
        - "2006-01-02T15:04:05.999999999Z07:00"
      ignore_missing: true

output.elasticsearch:
  hosts: ["http://elasticsearch:9200"]
  # ES 8.x 는 data stream 이 기본. 날짜별 인덱스를 직접 만들지 않고
  # 데이터 스트림 하나에 쓰면 ES 가 내부적으로 .ds-mmo-server-NNNNNN 으로 롤오버한다.
  index: "mmo-server"

# 인덱스 템플릿 이름/패턴이 data stream 이름과 맞아야 한다.
# 패턴을 "mmo-server-*" 로 두면 "mmo-server" 와 매칭되지 않아
# "no matching index template found for data stream" 400 에러로 이벤트가 전부 드롭된다.
setup.template.name: "mmo-server"
setup.template.pattern: "mmo-server*"
setup.template.overwrite: true
setup.template.settings:
  index.number_of_shards: 1
  index.number_of_replicas: 0     # 단일 노드라 복제본 0 (아니면 인덱스가 yellow)

setup.ilm.enabled: false          # 로컬은 ILM 없이 수동 관리
setup.kibana.host: "http://kibana:5601"

logging.level: info

# 동적 매핑에 맡기면 첫 문서의 값으로 타입이 굳어버린다.
# PacketsRecvPerSec 는 recv/5.0 이라 소수인데 서버가 유휴일 때 첫 값이 0 이면
# long 으로 잡히고, 이후 1234.6 같은 값은 소수점이 잘린 채 색인된다.
# 부하 테스트 그래프가 왜곡되므로 메트릭 필드는 타입을 명시한다.
setup.template.append_fields:
  - name: PacketsRecvPerSec
    type: double
  - name: PacketsSentPerSec
    type: double
  - name: TickAvgUs
    type: long
  - name: TickMaxUs
    type: long
  - name: WorkTicks
    type: long
  - name: IdleTicks
    type: long
  - name: Players
    type: long
  - name: EventType
    type: keyword
