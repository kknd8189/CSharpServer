# 리포 루트에서 실행 권장:
#   docker compose -f CICD/docker-compose.yml up -d --build
#   docker compose -f CICD/docker-compose.yml logs -f server
#   docker compose -f CICD/docker-compose.yml down            # 컨테이너만 제거 (데이터 유지)
#   docker compose -f CICD/docker-compose.yml down -v         # 볼륨까지 삭제 (DB 초기화)

name: mmo-stack

services:
  mariadb:
    image: mariadb:10.6
    container_name: mmo-mariadb
    restart: unless-stopped
    # 부하 테스트 시 동시 접속자 수가 기본 max_connections=151 을 넘어 ER_CON_COUNT_ERROR 발생.
    # 1000 으로 상향. 메모리 영향은 무시할 수준 (per-thread buffer ~256KB → 추가 ~200MB 한계).
    command:
      - --max-connections=1000
      - --max-allowed-packet=16M
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: GameDb
      MARIADB_USER: DY
      MARIADB_PASSWORD: "3306"
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "3306:3306"      # 호스트에서 직접 접속하려면 유지, 아니면 삭제 가능
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: mmo-redis
    restart: unless-stopped
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  accountserver:
    build:
      context: ..                       # 리포 루트
      dockerfile: CICD/Dockerfile.accountserver
    image: mmo-accountserver:local
    container_name: mmo-accountserver
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ASPNETCORE_URLS: http://+:5000
      # appsettings.json 의 Kestrel:Endpoints 가 https://localhost:5001 을 명시해서
      # ASPNETCORE_URLS 가 무시됨. 컨테이너엔 dev 인증서가 없으므로 http 로 오버라이드.
      Kestrel__Endpoints__Http__Url:  "http://+:5000"
      Kestrel__Endpoints__Https__Url: "http://+:5001"
      ConnectionStrings__DefaultConnection: "Server=mariadb;Port=3306;Database=AccountDB;User=DY;Password=3306;SslMode=none;"
      ConnectionStrings__SharedConnection:  "Server=mariadb;Port=3306;Database=SharedDB;User=DY;Password=3306;SslMode=none;"
      ConnectionStrings__RedisConnection:   "redis:6379"
    ports:
      - "5000:5000"

  server:
    build:
      context: ..
      dockerfile: CICD/Dockerfile.server
    image: mmo-server:local
    container_name: mmo-server
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # 마운트 트릭: Config.docker.json 을 컨테이너 내부 /Common/config.json 으로 매핑
      - ./Config.docker.json:/Common/config.json:ro
      - ../Common/Data:/Common/Data:ro
      - ../Common/MapData:/Common/MapData:ro
      - server-logs:/app/logs
    ports:
      - "7777:7777"
      - "9091:9091"      # 프로메테우스 스크레이프용 /metrics


  # ---------- 모니터링 스택 ----------
  # 게임서버는 ES를 전혀 모른다. 파일에만 쓰고 Filebeat가 실어 나른다.
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.0
    container_name: mmo-elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false        # 로컬 전용. 외부 노출 시 반드시 켤 것
      - "ES_JAVA_OPTS=-Xms512m -Xmx512m"    # 개발 머신에서 힙 512MB로 제한
    ulimits:
      memlock: { soft: -1, hard: -1 }
    volumes:
      - es-data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:9200/_cluster/health | grep -qE '\"status\":\"(green|yellow)\"'"]
      interval: 10s
      timeout: 5s
      retries: 30

  kibana:
    image: docker.elastic.co/kibana/kibana:8.15.0
    container_name: mmo-kibana
    restart: unless-stopped
    depends_on:
      elasticsearch:
        condition: service_healthy
    environment:
      ELASTICSEARCH_HOSTS: http://elasticsearch:9200
    ports:
      - "5601:5601"

  filebeat:
    image: docker.elastic.co/beats/filebeat:8.15.0
    container_name: mmo-filebeat
    restart: unless-stopped
    user: root                              # 볼륨 안의 로그 파일 읽기 권한
    depends_on:
      elasticsearch:
        condition: service_healthy
    # 이미지 기본 CMD(-environment container)를 덮어쓰면 로그가 stdout 으로 안 나오므로 함께 지정.
    # strict.perms 는 마운트된 설정 파일의 소유자 검사를 끄는 용도.
    command: ["-environment", "container", "-strict.perms=false"]
    volumes:
      - ./filebeat.yml:/usr/share/filebeat/filebeat.yml:ro
      - server-logs:/logs:ro                 # 서버와 같은 볼륨 (읽기 전용)
      - filebeat-data:/usr/share/filebeat/data   # 읽은 오프셋 보존 → 재시작 시 중복 전송 방지


  # ---------- 메트릭 스택 ----------
  # 성능 지표는 프로메테우스가 /metrics 를 긁어가고(pull), 로그는 위의 ES 로 간다.
  # "몇 %인가"는 프로메테우스, "누가 언제 무엇을"은 Elasticsearch 로 역할을 나눴다.
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: mmo-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: mmo-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"        # 로컬 전용. 외부 노출 시 반드시 끌 것
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"

volumes:
  mariadb-data:
  redis-data:
  server-logs:
  es-data:
  prometheus-data:
  grafana-data:
  filebeat-data:
